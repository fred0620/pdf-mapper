# PDF 解析器的 CI/CD
#
# 平常 push：跑測試
# 打標籤（例如 v0.2.1）：測試通過才打包並建立 Release
# 套件弱點檢查（pip-audit）要連 pypi.org 的弱點資料庫，公司鏡像沒有，所以不放在 CI，
# 發版前在自己的電腦執行，見 docs/maintain.md。
#
# 同事從 Releases 頁下載 ZIP 和 SHA256SUMS.txt，放進工具資料夾後雙擊 run.bat，核對相符就會安裝。
# 發布步驟見 docs/maintain.md。
#
# 全部 job 都用同一個映像檔（UV_IMAGE），不需要從 Docker Hub 或 registry.gitlab.com 拉其他映像檔。
# 套件預設從 pypi.org 下載；公司網路擋住時，設定下面的 PIP_MIRROR 即可，不用改這個檔案。
#
# 選用的 CI/CD 變數（Settings > CI/CD > Variables）：
#   PIP_MIRROR       公司內部 PyPI 鏡像網址（runner 連不到 pypi.org 時必填，向 IT 要）
#   CA_BUNDLE        公司憑證，類型選 File（鏡像或 GitLab 用公司自己的憑證時才需要）
#   UV_IMAGE         公司要用內部映像檔時改這裡

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

# 打標籤的 pipeline 拿得到 CI_JOB_TOKEN，可以上傳到套件庫，用到的映像檔與工具都要鎖版本
variables:
  UV_IMAGE: ghcr.io/astral-sh/uv:0.13.6-python3.12-bookworm-slim
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  UV_LINK_MODE: copy
  UV_NO_PROGRESS: "1"
  UV_PYTHON_DOWNLOADS: never     # 用映像檔裡的 Python，不另外下載

default:
  image: $UV_IMAGE
  before_script:
    - . scripts/ci_env.sh        # 套件來源、公司憑證，並先確認連得到
  cache:
    key:
      files: [app/uv.lock]
    paths: [.uv-cache]

stages: [test, build, release]

test:
  stage: test
  script:
    # pyproject.toml 改了卻忘了更新 uv.lock。不用連網；暫時拿掉鏡像設定，
    # 否則 uv 會因為鏡像網址和 lock 裡記的 pypi.org 不同，誤判 lock 需要更新
    - env -u UV_DEFAULT_INDEX uv lock --project app --check --offline
    # 不用 uv sync：它會照 uv.lock 記的 pypi.org 網址下載，鏡像設定無效。
    # 改成匯出含 SHA256 的清單，再從設定的來源安裝，檔案仍要和 uv.lock 完全相同。
    - uv export --project app --frozen --no-emit-project --quiet --output-file /tmp/requirements-ci.txt
    - uv venv /tmp/venv --python 3.12
    - uv pip install --python /tmp/venv/bin/python --require-hashes -r /tmp/requirements-ci.txt
    - /tmp/venv/bin/python -m pytest -q tests

package:
  stage: build
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - python3 scripts/build_release.py --wheels      # 只用標準函式庫，不需要先裝專案的套件
  artifacts:
    paths: [dist/]
    expire_in: never

release:
  stage: release
  needs: [package]
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - python3 scripts/publish_release.py
