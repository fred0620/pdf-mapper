<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 解析器</title>
<link rel="stylesheet" href="/web/style.css">
</head>
<body>
<header class="bar">
  <h1>PDF 解析器 <span id="version" class="version"></span></h1>
  <nav aria-label="主要功能">
    <button id="tabTrain" class="tab">建立範本</button>
    <button id="tabRun" class="tab">解析 PDF</button>
  </nav>
  <div id="engine" class="engine"></div>
  <button id="helpBtn" type="button" class="manual-link help-trigger" aria-haspopup="dialog" aria-expanded="false" aria-controls="helpPopover">說明 ▾<span class="help-dot" hidden></span></button>
</header>
<div id="updateBanner" class="update-banner" role="status" hidden>
  <span id="updateBannerText"></span>
  <button id="updateBannerClose" type="button" class="update-banner-close">我知道了</button>
</div>
<p class="hint narrow-note" role="note">視窗太窄，PDF 和設定擠在一起不好操作，請把視窗放大或最大化。</p>
<div class="workspace">
  <aside id="left" class="side left" aria-label="檔案"></aside>
  <main class="center">
    <div id="toolbar" class="toolbar"></div>
    <div id="guideBar" class="guide-bar" hidden aria-label="導覽進度"></div>
    <div id="missionStrip" class="mission-strip" hidden aria-live="polite" aria-atomic="true"></div>
    <p id="hint" class="hint" role="status"></p>
    <div id="stage" class="stage">
      <div id="empty" class="empty"></div>
      <div id="sheet" class="sheet" hidden>
        <img id="pageImage" alt="PDF 頁面" draggable="false">
        <div id="overlay" class="overlay"></div>
      </div>
    </div>
    <p id="popnote" class="popnote" role="status" hidden></p>
    <section id="drawer" class="drawer" hidden aria-label="抓取結果"></section>
  </main>
  <aside id="right" class="side right" aria-label="設定"></aside>
</div>
<div id="coachCard" class="float-card coach-card" hidden role="dialog" aria-label="操作提示"></div>
<div id="helpPopover" class="float-card help-popover" hidden role="dialog" aria-label="說明"></div>
<div id="whatsNewCard" class="float-card whatsnew-card" hidden role="dialog" aria-label="新功能"></div>
<div id="missionPointer" class="mission-pointer" hidden aria-hidden="true"></div>
<div id="toast" class="toast" role="alert" hidden></div>
<input id="filePicker" type="file" accept="application/pdf" multiple hidden>
<script src="/web/spotlights.js"></script>
<script src="/web/labs.js"></script>
<script src="/web/app.js"></script>
</body>
</html>
